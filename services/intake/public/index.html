<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ResQGrid Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
    h1 { margin-bottom: 4px; }
    #status { color: #666; font-size: 14px; margin-bottom: 20px; }
    #status.error { color: #b00020; }
    h2 { margin-top: 28px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 14px; }
    th { background: #f4f4f4; }
    .pending { color: #b45f06; font-weight: 600; }
    .allocated, .available { color: #1b7f3b; font-weight: 600; }
    .in-use { color: #b00020; font-weight: 600; }
  </style>
</head>
<body>
  <h1>ResQGrid Dashboard</h1>
  <div id="status">Loading...</div>

  <h2>Requests</h2>
  <table id="requests"><thead><tr>
    <th>ID</th><th>Type</th><th>Location</th><th>Severity</th><th>Status</th><th>Created</th>
  </tr></thead><tbody></tbody></table>

  <h2>Allocations</h2>
  <table id="allocations"><thead><tr>
    <th>ID</th><th>Request</th><th>Severity</th><th>Resource</th><th>Allocated at</th>
  </tr></thead><tbody></tbody></table>

  <h2>Resources</h2>
  <table id="resources"><thead><tr>
    <th>ID</th><th>Name</th><th>Type</th><th>Location</th><th>Availability</th>
  </tr></thead><tbody></tbody></table>

  <script>
    // Use the same host the page was loaded from. The cloud intake page is served on port 30000,
    // so allocation is on 30001 there. Everywhere else it stays on 3001 as before.
    const ALLOCATION_PORT = location.port === '30000' ? 30001 : 3001;
    const ALLOCATION_URL = `${location.protocol}//${location.hostname}:${ALLOCATION_PORT}`;
    const REFRESH_MS = 3000;

    async function getJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url} returned ${response.status}`);
      return response.json();
    }

    // Each column is [function that gets the text, optional CSS class function].
    function fillTable(tableId, rows, columns) {
      const tbody = document.querySelector(`#${tableId} tbody`);
      tbody.replaceChildren();
      for (const row of rows) {
        const tr = document.createElement('tr');
        for (const [getText, getClass] of columns) {
          const td = document.createElement('td');
          td.textContent = getText(row);
          if (getClass) td.className = getClass(row);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    const time = (value) => new Date(value).toLocaleTimeString();

    async function refresh() {
      const status = document.getElementById('status');
      try {
        const [requests, allocations, resources] = await Promise.all([
          getJson('/requests'),
          getJson(`${ALLOCATION_URL}/allocations`),
          getJson(`${ALLOCATION_URL}/resources`),
        ]);

        fillTable('requests', requests, [
          [(r) => r.id], [(r) => r.type], [(r) => r.location], [(r) => r.severity],
          [(r) => r.status, (r) => r.status], [(r) => time(r.created_at)],
        ]);
        fillTable('allocations', allocations, [
          [(a) => a.id], [(a) => `#${a.request_id} (${a.request_type})`], [(a) => a.severity],
          [(a) => a.resource_name], [(a) => time(a.allocated_at)],
        ]);
        fillTable('resources', resources, [
          [(r) => r.id], [(r) => r.name], [(r) => r.type], [(r) => r.location],
          [(r) => (r.available ? 'available' : 'in use'), (r) => (r.available ? 'available' : 'in-use')],
        ]);

        status.className = '';
        status.textContent = `Last updated ${new Date().toLocaleTimeString()} (refreshes every ${REFRESH_MS / 1000}s)`;
      } catch (err) {
        status.className = 'error';
        status.textContent = `Could not load data: ${err.message}. Are both services running?`;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>

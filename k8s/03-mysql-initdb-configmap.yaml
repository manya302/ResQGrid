apiVersion: v1
data:
  schema.sql: |-
    DROP TABLE IF EXISTS allocations;
    DROP TABLE IF EXISTS requests;
    DROP TABLE IF EXISTS resources;

    CREATE TABLE requests (
      id         INT AUTO_INCREMENT PRIMARY KEY,
      type       ENUM('medical', 'fire', 'rescue', 'other') NOT NULL,
      location   VARCHAR(255) NOT NULL,
      severity   TINYINT UNSIGNED NOT NULL,
      status     ENUM('pending', 'allocated') NOT NULL DEFAULT 'pending',
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      CONSTRAINT chk_severity CHECK (severity BETWEEN 1 AND 5),
      INDEX idx_status_severity (status, severity, created_at)
    );

    CREATE TABLE resources (
      id        INT AUTO_INCREMENT PRIMARY KEY,
      name      VARCHAR(100) NOT NULL,
      type      ENUM('rescue_team', 'hospital_bed') NOT NULL,
      location  VARCHAR(255) NOT NULL,
      available BOOLEAN NOT NULL DEFAULT TRUE,
      INDEX idx_type_available (type, available)
    );

    CREATE TABLE allocations (
      id           INT AUTO_INCREMENT PRIMARY KEY,
      request_id   INT NOT NULL,
      resource_id  INT NOT NULL,
      allocated_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      UNIQUE KEY uq_request (request_id),
      FOREIGN KEY (request_id)  REFERENCES requests(id),
      FOREIGN KEY (resource_id) REFERENCES resources(id)
    );

    INSERT INTO resources (name, type, location) VALUES
      ('Rescue Team Alpha',   'rescue_team',  'North Station'),
      ('Rescue Team Bravo',   'rescue_team',  'East Station'),
      ('Rescue Team Charlie', 'rescue_team',  'South Station'),
      ('City Hospital Bed 1', 'hospital_bed', 'City Hospital'),
      ('City Hospital Bed 2', 'hospital_bed', 'City Hospital');

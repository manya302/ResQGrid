apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intake
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intake
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30